name: codeua.foundation101.org

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: codeua:${APP_VERSION}
    pull_policy: missing
    restart: always
    env_file:
      - src/assets/.env
    volumes:
      - ./src/assets/locales:/app/src/assets/locales
      - ./src/assets/sounds:/app/src/assets/sounds
    ports:
      - "8006:8000"

  cloudflared:
#    image: cloudflare/cloudflared:latest
    image: cloudflare/cloudflared:2026.10.3
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE__TUNNEL_TOKEN}
    depends_on:
      - web

[project]
name = "codeua"
version = "1.2.4"
description = "Application for honoring Ukrainian Heroes"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Andrii Bogdanovych", email = "ab@foundation101.org" }
]

dependencies = [
    "flet==0.82.2",
    "flet-audio==0.82.2",
    "flet-storage==1.1.3",
    "fluent-manager==1.0.2",
    "httpx==0.28.1",
    "pydantic-settings==2.14.0",
    "pydantic==2.13.3",
]

[dependency-groups]
dev = [
    "flet-cli==0.82.2",     # Необіхдно для продакшену (веб)
    "flet-web==0.82.2",     # Необіхдно для продакшену (веб)
    "flet-desktop==0.82.2", # Необіхдно для продакшену (веб)
    "flet-desktop-light",
    "pre_commit",
    "black",
    "isort",
]

[tool.flet]
org = "org.foundation101"
product = "CodeUA"
description = "Щоденне вшанування пам’яті Героїв України. Хвилина мовчання та Гімн"
company = "NGO Foundation.101"
copyright = "Copyright (C) 2026 by NGO Foundation.101"

[tool.flet.app]
path = "src"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py312']
skip-string-normalization = true

[tool.isort]
profile = "black"
